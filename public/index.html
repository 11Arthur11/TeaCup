<!doctype html>
<html lang="fa" dir="rtl" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#050d19" />
  <meta name="description" content="ابر چایی؛ پنل حرفه‌ای خرید و مدیریت سرورهای TeaSpeak و سرویس‌های AudioBot" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" type="image/png" href="/assets/teacloud-logo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Estedad:wght@400;500;600;700;800&family=Vazirmatn:wght@300;400;500;600;700;800&family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,300..700,0..1,0" rel="stylesheet" />
  <link rel="stylesheet" href="/assets/styles.css" />
  <title>ابر چایی | TeaCloud</title>
  <script>try{const t=localStorage.getItem('teacloud-theme');document.documentElement.dataset.theme=t==='light'?'light':'dark';document.documentElement.style.colorScheme=document.documentElement.dataset.theme}catch{document.documentElement.dataset.theme='dark'}</script>
</head>
<body>
  <noscript>برای استفاده از ابر چایی، جاوااسکریپت مرورگر را فعال کنید.</noscript>
  <div id="app" aria-live="polite"></div>
  <div id="toast-root" class="toast-root" aria-live="assertive"></div>
  <div id="dialog-root"></div>
  <script src="/config.js"></script>
  <script type="module" src="/assets/main.js"></script>
</body>
</html>
